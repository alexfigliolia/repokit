[package]
name = "repokit"
version = "2.1.0"
edition = "2024"

[[bin]]
name = "repokit"
path = "internals/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3"
normalize-path = "0.2.1"
alphanumeric-sort = "1.5.5"
tokio = "1.50.0"
ignore = "0.4.25"
regex = { version = "1.12.3", features = ["std", "unicode"] }
shellexpand = "3.1.2"
