[package]
name = "repokit"
version = "5.1.2"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["Alex Figliolia"]
description = "A knowledgebase for your repository - wrapped in a CLI"
homepage = "https://github.com/alexfigliolia/repokit"
repository = "https://github.com/alexfigliolia/repokit"
keywords = ["cli", "devtool", "repository", "toolchain"]

[[bin]]
name = "repokit"
path = "internals/main.rs"

[dependencies]
jsonschema = { version = "0.46.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
colored = "3"
normalize-path = "0.2.1"
alphanumeric-sort = "1.5.7"
ignore = "0.4.26"
regex = { version = "1.12.4", features = ["std", "unicode"] }
shellexpand = "3.1.2"
schemars = "1.2.1"
futures = "0.3.32"
tokio = { version = "1.52.1", features = ["full"] }
inquire = "0.9.4"
inquire-derive = "0.9.4"
sha2 = "0.11.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
